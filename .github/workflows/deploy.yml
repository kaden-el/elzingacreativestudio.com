name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate config.js from secrets
        run: |
          # NOTE 2026-08-05: the Supabase keys used to be emitted here too. That
          # project (wpvydafeuuwiqkaudsnu) no longer resolves — it was deleted —
          # so the site was publishing a dead host on every page load. Nothing in
          # the public funnel ever read it; only the three orphaned app pages
          # (client_intake / client_dashboard / agency_dashboard) did, and they
          # are broken regardless. Dropped rather than shipped dead.
          cat > config.js << EOF
          window.ELZINGA_CONFIG = {
            emailjsPublicKey:  '${{ secrets.EMAILJS_PUBLIC_KEY }}',
            emailjsServiceId:  '${{ secrets.EMAILJS_SERVICE_ID }}',
            emailjsTemplateId: '${{ secrets.EMAILJS_TEMPLATE_ID }}',
            turnstileSiteKey:  '${{ secrets.TURNSTILE_SITE_KEY }}',
          };
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
