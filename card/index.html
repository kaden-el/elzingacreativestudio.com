<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Kaden Elzinga — Elzinga Creative Studio</title>
<meta name="description" content="Save Kaden Elzinga's contact — photography, video & marketing, Grand Rapids MI." />

<!-- Open Graph: clean text preview when the link is sent -->
<meta property="og:title" content="Kaden Elzinga — Elzinga Creative Studio" />
<meta property="og:description" content="Tap to save my contact — photo, phone, email, the works." />
<meta property="og:type" content="profile" />
<meta name="theme-color" content="#f7f7f7" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet" />

<style>
  /* Brand tokens — pulled straight from elzingacreativestudio.com */
  :root{
    --black:#111111;
    --ink:#111111;
    --white:#ffffff;
    --off-white:#f7f7f7;
    --border:#e0e0e0;
    --gray:#666666;
    --gray-lt:#aaaaaa;
    --green:#2a5c3f;
    --green-dk:#1e4430;
    --green-tint:rgba(42,92,63,.08);
    --ease:cubic-bezier(.2,.7,.2,1);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}

  body{
    min-height:100svh;
    font-family:"DM Sans",system-ui,-apple-system,sans-serif;
    color:var(--ink);
    background:var(--off-white);
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:clamp(16px,5vw,56px) 16px;
  }

  .card{
    width:100%;
    max-width:412px;
    background:var(--white);
    border:1px solid var(--border);
    padding:40px 26px 24px;
    text-align:center;
    position:relative;
    box-shadow:0 1px 2px rgba(17,17,17,.03),0 24px 60px -34px rgba(17,17,17,.22);
  }
  /* green keyline at the very top — the brand's accent band, distilled */
  .card::before{
    content:"";
    position:absolute;top:0;left:0;right:0;
    height:4px;
    background:var(--green);
  }

  .reveal{opacity:0;transform:translateY(12px);animation:rise .7s var(--ease) forwards}
  @keyframes rise{to{opacity:1;transform:none}}

  .kicker{
    font-size:11px;
    font-weight:700;
    letter-spacing:.26em;
    text-transform:uppercase;
    color:var(--gray);
    margin-bottom:26px;
  }

  /* headshot — sharp square, matching the brand's photo treatment */
  .avatar-wrap{
    width:132px;height:132px;
    margin:0 auto 24px;
    position:relative;
  }
  .avatar{
    width:100%;height:100%;
    object-fit:cover;
    display:block;
    border:1px solid var(--border);
    background:var(--off-white);
  }
  .avatar.monogram{
    display:flex;align-items:center;justify-content:center;
    background:var(--green);
    color:var(--white);
    font-weight:800;
    font-size:42px;
    letter-spacing:.02em;
    border:none;
  }
  /* small green corner tab — a quiet brand mark */
  .avatar-wrap::after{
    content:"";
    position:absolute;
    right:-1px;bottom:-1px;
    width:18px;height:18px;
    background:var(--green);
  }

  .name{
    font-weight:800;
    font-size:clamp(2.2rem,9vw,2.7rem);
    line-height:.96;
    letter-spacing:-.03em;
    color:var(--black);
    margin-bottom:2px;
  }

  /* primary CTA — brand .btn-green DNA: green, square, uppercase, tracked */
  .save{
    display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;
    margin-top:28px;
    padding:18px 20px;
    border:none;
    border-radius:0;
    font-family:inherit;
    font-size:12.5px;
    font-weight:800;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--white);
    background:var(--green);
    cursor:pointer;
    transition:background .2s var(--ease),transform .15s var(--ease);
    -webkit-tap-highlight-color:transparent;
  }
  .save:hover{background:var(--green-dk)}
  .save:active{transform:translateY(1px)}
  .save svg{width:18px;height:18px}
  .save.done{background:var(--black)}

  .save-hint{
    margin-top:11px;
    font-size:12.5px;
    color:var(--gray-lt);
  }

  .divider{
    display:flex;align-items:center;gap:14px;
    margin:26px 2px 18px;
    color:var(--gray-lt);
    font-size:10px;
    font-weight:700;
    letter-spacing:.24em;
    text-transform:uppercase;
  }
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border)}

  .actions{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px}
  .action{
    display:flex;align-items:center;gap:12px;
    min-width:0;
    padding:14px 15px;
    border:1px solid var(--border);
    background:var(--white);
    color:var(--ink);
    text-decoration:none;
    text-align:left;
    transition:border-color .18s,background .18s,transform .12s var(--ease);
    -webkit-tap-highlight-color:transparent;
  }
  .action:hover{border-color:var(--green);background:var(--off-white)}
  .action:active{transform:translateY(1px)}
  /* full-width rows (long values) get a chevron affordance */
  .action.full{grid-column:1 / -1;position:relative;padding-right:36px}
  .action.full::after{
    content:"";position:absolute;right:16px;top:50%;
    width:7px;height:7px;
    border-right:2px solid var(--gray-lt);border-top:2px solid var(--gray-lt);
    transform:translateY(-50%) rotate(45deg);
    transition:border-color .18s;
  }
  .action.full:hover::after{border-color:var(--green)}
  .ico{
    width:34px;height:34px;flex:none;
    display:flex;align-items:center;justify-content:center;
    background:var(--green-tint);
    color:var(--green);
  }
  .ico svg{width:17px;height:17px}
  .action .meta{display:flex;flex-direction:column;align-items:flex-start;line-height:1.25;min-width:0;font-size:14px;font-weight:700}
  .action .meta small{font-size:11px;font-weight:500;color:var(--gray);letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;text-transform:none}

  .footer{margin-top:22px;display:flex;flex-direction:column;align-items:center;gap:16px}
  .footer-actions{display:flex;gap:9px;align-items:center;justify-content:center;flex-wrap:wrap}
  .ghost{
    background:none;border:1px solid var(--border);cursor:pointer;
    font-family:inherit;font-size:11px;font-weight:700;
    letter-spacing:.13em;text-transform:uppercase;
    color:var(--green);
    display:inline-flex;align-items:center;gap:8px;
    padding:11px 16px;
    transition:border-color .18s,background .18s;
    -webkit-tap-highlight-color:transparent;
  }
  .ghost:hover{border-color:var(--green);background:var(--off-white)}
  .ghost svg{width:14px;height:14px}
  .sig{font-size:11px;color:var(--gray-lt);letter-spacing:.04em}
  .sig b{color:var(--green);font-weight:700}

  /* QR overlay */
  .qr-modal{
    position:fixed;inset:0;z-index:40;
    display:flex;align-items:center;justify-content:center;padding:24px;
    background:rgba(17,17,17,.55);
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
    opacity:0;animation:fade .25s var(--ease) forwards;
  }
  .qr-modal[hidden]{display:none}  /* author display:flex would otherwise override [hidden] */
  @keyframes fade{to{opacity:1}}
  .qr-sheet{
    position:relative;background:var(--white);
    border:1px solid var(--border);border-top:4px solid var(--green);
    padding:32px 28px 24px;text-align:center;width:100%;max-width:300px;
    box-shadow:0 30px 70px -30px rgba(17,17,17,.55);
  }
  .qr-close{
    position:absolute;top:6px;right:12px;
    background:none;border:none;cursor:pointer;
    font-size:26px;line-height:1;color:var(--gray-lt);
  }
  .qr-close:hover{color:var(--ink)}
  .qr-kicker{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gray);margin-bottom:18px}
  .qr-img{width:218px;height:218px;display:block;margin:0 auto;image-rendering:pixelated}
  .qr-sub{margin-top:16px;font-size:12px;color:var(--gray-lt);letter-spacing:.03em}

  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:var(--black);color:var(--white);
    padding:13px 18px;
    font-size:13px;font-weight:500;letter-spacing:.01em;
    box-shadow:0 20px 50px -20px rgba(17,17,17,.5);
    opacity:0;pointer-events:none;
    transition:opacity .3s,transform .3s var(--ease);
    z-index:20;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (prefers-reduced-motion:reduce){
    .reveal{animation:none;opacity:1;transform:none}
    *{transition:none!important}
  }
</style>
</head>
<body>
  <main class="card">
    <p class="kicker reveal" style="animation-delay:.05s">Elzinga Creative Studio</p>

    <div class="avatar-wrap reveal" style="animation-delay:.12s">
      <img id="avatar" class="avatar" alt="Kaden Elzinga" />
    </div>

    <h1 class="name reveal" id="name" style="animation-delay:.18s">Kaden Elzinga</h1>

    <button class="save reveal" id="save" style="animation-delay:.28s">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
      <span id="save-label">Save my contact</span>
    </button>
    <p class="save-hint reveal" style="animation-delay:.34s">Adds me to your phone — photo and all.</p>

    <div class="divider reveal" style="animation-delay:.4s">or reach me</div>

    <nav class="actions reveal" id="actions" style="animation-delay:.46s"></nav>

    <div class="footer reveal" style="animation-delay:.54s">
      <div class="footer-actions">
        <button class="ghost" id="show-qr">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3M21 14v3M14 21h3"/></svg>
          Show QR
        </button>
        <button class="ghost" id="share" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/></svg>
          Share
        </button>
      </div>
      <p class="sig">Tap <b>save</b> so you don't lose me.</p>
    </div>
  </main>

  <div class="qr-modal" id="qr-modal" hidden>
    <div class="qr-sheet">
      <button class="qr-close" id="qr-close" aria-label="Close">&times;</button>
      <p class="qr-kicker">Scan to open my card</p>
      <img class="qr-img" src="qr.png" alt="QR code linking to elzingacreativestudio.com/card" />
      <p class="qr-sub">elzingacreativestudio.com/card</p>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
/* ============================================================
   EDIT HERE — fill in the blanks, then re-deploy. That's it.
   Leave a field as "" to hide that button automatically.
   ============================================================ */
const CARD = {
  firstName : "Kaden",
  lastName  : "Elzinga",
  org       : "Elzinga Creative Studio",
  title     : "Photography · Video · Marketing",     // your line under the name
  phone     : "+16162584578",                        // blank hides Call + Text
  email     : "kaden@elzingacreativestudio.com",
  website   : "https://elzingacreativestudio.com",
  instagram : "kaden_elzinga",                       // handle without @ (blank hides)
  city      : "Grand Rapids",
  region    : "MI",
  country   : "USA",
  headshot  : "headshot.jpg",                         // photo in this folder (blank = initials)
  note      : "Photographer & videographer — Grand Rapids, MI"
};
/* ============================================================ */

const $ = (id) => document.getElementById(id);
const fullName = `${CARD.firstName} ${CARD.lastName}`.trim();
const prettyPhone = (p) => p.replace(/^\+1(\d{3})(\d{3})(\d{4})$/, "($1) $2-$3");
const igUrl = CARD.instagram ? `https://instagram.com/${CARD.instagram.replace(/^@/,"")}` : "";
const siteLabel = CARD.website.replace(/^https?:\/\//,"").replace(/\/$/,"");

$("name").textContent = fullName;
/* note: title + city/region are intentionally not shown on the card,
   but they're still written into the saved vCard below. */

/* headshot or monogram fallback */
const avatar = $("avatar");
function useMonogram(){
  const div = document.createElement("div");
  div.className = "avatar monogram";
  div.textContent = (CARD.firstName[0]||"") + (CARD.lastName[0]||"");
  div.setAttribute("aria-label", fullName);
  avatar.replaceWith(div);
}
let photoDataUrl = null;
if (CARD.headshot){
  avatar.src = CARD.headshot;
  avatar.onerror = useMonogram;
  fetch(CARD.headshot).then(r=>r.ok?r.blob():Promise.reject()).then(b=>{
    const fr = new FileReader();
    fr.onload = ()=> photoDataUrl = fr.result;
    fr.readAsDataURL(b);
  }).catch(()=>{});
} else { useMonogram(); }

/* action buttons (data-driven; blanks auto-hide) */
const ICONS = {
  call:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.4-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2Z"/></svg>`,
  text:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z"/></svg>`,
  email:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>`,
  insta:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>`,
  web:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20Z"/></svg>`
};
const actions = [];
if (CARD.phone){
  actions.push({icon:"call", label:"Call", sub:prettyPhone(CARD.phone), href:`tel:${CARD.phone}`, full:true});
  actions.push({icon:"text", label:"Text", sub:"Send a message",        href:`sms:${CARD.phone}`, full:true});
}
if (CARD.email)   actions.push({icon:"email", label:"Email", sub:CARD.email, href:`mailto:${CARD.email}`, full:true});
if (igUrl)        actions.push({icon:"insta", label:"Instagram", sub:`@${CARD.instagram.replace(/^@/,"")}`, href:igUrl, full:true});
if (CARD.website) actions.push({icon:"web", label:"Website", sub:siteLabel, href:CARD.website, full:true});

const nav = $("actions");
actions.forEach(a=>{
  const el = document.createElement("a");
  el.className = "action" + (a.full ? " full":"");
  el.href = a.href;
  if (a.icon==="insta"||a.icon==="web"){ el.target="_blank"; el.rel="noopener"; }
  el.innerHTML = `<span class="ico">${ICONS[a.icon]}</span><span class="meta">${a.label}<small>${a.sub}</small></span>`;
  nav.appendChild(el);
});

/* vCard builder */
function fold(line){
  if (line.length <= 75) return line;
  let out = line.slice(0,75), rest = line.slice(75);
  while (rest.length){ out += "\r\n " + rest.slice(0,74); rest = rest.slice(74); }
  return out;
}
function buildVCard(){
  const L = [
    "BEGIN:VCARD","VERSION:3.0",
    `N:${CARD.lastName};${CARD.firstName};;;`,
    `FN:${fullName}`,
    CARD.org   ? `ORG:${CARD.org}` : "",
    CARD.title ? `TITLE:${CARD.title}` : "",
    CARD.phone ? `TEL;TYPE=CELL,VOICE:${CARD.phone}` : "",
    CARD.email ? `EMAIL;TYPE=INTERNET,WORK:${CARD.email}` : "",
    CARD.website ? `URL:${CARD.website}` : "",
    igUrl ? `X-SOCIALPROFILE;TYPE=instagram:${igUrl}` : "",
    igUrl ? `item1.URL:${igUrl}` : "",
    igUrl ? "item1.X-ABLabel:Instagram" : "",
    (CARD.city||CARD.region) ? `ADR;TYPE=WORK:;;;${CARD.city};${CARD.region};;${CARD.country}` : "",
    CARD.note ? `NOTE:${CARD.note}` : ""
  ];
  if (photoDataUrl && photoDataUrl.startsWith("data:image")){
    const m = photoDataUrl.match(/^data:image\/(\w+);base64,(.+)$/);
    if (m){
      const type = m[1].toUpperCase()==="JPG" ? "JPEG" : m[1].toUpperCase();
      L.push(fold(`PHOTO;ENCODING=b;TYPE=${type}:${m[2]}`));
    }
  }
  L.push("END:VCARD");
  return L.filter(Boolean).join("\r\n");
}

let toastTimer;
function toast(msg){
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 3200);
}

$("save").addEventListener("click", ()=>{
  const vcard = buildVCard();
  const blob = new Blob([vcard], {type:"text/vcard;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${CARD.firstName}-${CARD.lastName}.vcf`;
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 1500);

  const btn = $("save");
  btn.classList.add("done");
  $("save-label").textContent = "Got it — open the file";
  toast("Open the downloaded card to add me to Contacts.");
  setTimeout(()=>{ btn.classList.remove("done"); $("save-label").textContent = "Save my contact"; }, 4500);
});

const shareBtn = $("share");
if (navigator.share){
  shareBtn.hidden = false;
  shareBtn.addEventListener("click", ()=>{
    navigator.share({ title: fullName, text: `${fullName} — ${CARD.org}`, url: location.href }).catch(()=>{});
  });
}

/* QR overlay — let someone scan your card in person */
const qrModal = $("qr-modal");
const closeQR = ()=> qrModal.hidden = true;
$("show-qr").addEventListener("click", ()=> qrModal.hidden = false);
$("qr-close").addEventListener("click", closeQR);
qrModal.addEventListener("click", (e)=>{ if (e.target === qrModal) closeQR(); });
document.addEventListener("keydown", (e)=>{ if (e.key === "Escape") closeQR(); });
</script>
</body>
</html>
